name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # täglich um 00:00 UTC
  workflow_dispatch:       # manueller Start
  push:
    branches:
      - main               # ggf. "master", falls dein Branch so heißt

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: theslasher5g
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
